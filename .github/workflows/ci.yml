name: CI / CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint the code
        run: pnpm lint

      - name: Run Prettier check
        run: pnpm format:check

      - name: Install browsers
        run: pnpm test:browser:install

      - name: Run tests
        run: pnpm test

      - name: Build the project
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    needs: build
    # Pull requests from forks have no access to secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}

    steps:
      - name: Check Vercel credentials
        id: creds
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not set; skipping deployment."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Install pnpm
        if: steps.creds.outputs.ok == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        if: steps.creds.outputs.ok == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: steps.creds.outputs.ok == 'true'
        run: vercel pull --yes --environment=$VERCEL_ENV --token=$VERCEL_TOKEN

      - name: Build with Vercel
        if: steps.creds.outputs.ok == 'true'
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then
            vercel build --prod --token=$VERCEL_TOKEN
          else
            vercel build --token=$VERCEL_TOKEN
          fi

      - name: Deploy prebuilt output
        id: deploy
        if: steps.creds.outputs.ok == 'true'
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then
            url=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          else
            url=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed to Vercel ($VERCEL_ENV)" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on pull request
        if: steps.creds.outputs.ok == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview deployment: ${{ steps.deploy.outputs.url }}`,
            })
